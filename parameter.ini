[Motion]
Grid_Cols=10
Grid_Rows=6
Block_Difference_Ratio_Threshold=0.03
Search_Mode=1
Enable_Block_Decay=0
Block_Decay_Frames=6
Enable_Block_Dilation=0
Block_Dilation_Threshold=4
Diff_Check_Range=5  

[Object]
Block_Merge_Range=1
Foreground_Merge_Range=6
Block_Minimum_Number=3

[Tracking]
Tracking_Mode=4
Tracking_Overlap_Threshold=0.5

[FallDetect]
Fall_Detect_Minimum_Strength=2.5
Fall_Detect_Strong_Strength=6.0
Fall_Detect_Acceleration_Threshold=-4.0
Fall_Detect_Accel_Upper_Threshold=6.0
Fall_Detect_Accel_Lower_Threshold=-4.0
Enable_Face_Detection=1
Face_Detect_Interval_Frames=8
Enable_Bed_Exit_Verification=0
Enable_Block_Shrink_Verification=0
Fall_Detect_Bed_Pixel_Ratio_Threshold=0.15
Fall_Detect_Momentum_Calc_Type=1 ; 0: Average (Default), 1: Max Block
; Post-Bed-Exit Threshold Adjustment
; When enabled, threshold1 is multiplied by the factor below for 30 frames after a bed exit event.
; Set multiplier < 1.0 to lower threshold (easier to trigger), > 1.0 to raise it (harder to trigger).
Enable_Post_BedExit_Threshold=1
Post_BedExit_Threshold_Multiplier=0.7
Projection_Use_Foreground=0

; BG Mask Controls
Enable_Save_BG_Mask = 1
BG_Init_Start_Frame = 2
BG_Init_End_Frame = 5
BG_Update_Interval = 8
BG_Update_Alpha = 0.1
BG_Diff_Threshold = 18
Bed_Update_Alpha_Multiplier = 8.0 ; Multiplier for empty bed region (Fast Update)
Safe_Area_Ratio_Threshold=0.5
Fall_Detect_Frame_History_Length=30
Fall_Detect_Frame_History_Threshold=5
Fall_Detect_Post_Fall_Distance_Threshold=4.0
Fall_Detect_Post_Fall_Check_Frames=5
Enable_Face_Detection=1

[Demo]
Demo_Save_Image_Path=0125_bgtest
Demo_Enable_Save_Images=1
Demo_Draw_Background_Noise=0


[Validation]
Expected_Frame_Interval=33
Frame_Interval_Tolerance=10

[OpticalFlow]
CompareFrameDistance = 2
PerspectivePointX = 416
PerspectivePointY = 474
VelocityThreshold = 6.0 #3.5
; Min trigger area (pixels) for Area Override filter (mid-frame base)
; Far zone (top 33%): x0.2, Mid zone (33-66%): x1.0, Near zone (bottom 33%): x5.0
MinTriggerArea = 2000

